<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function simulateTask() {
        let task = new Promise((resolve, reject) => {
          let doneTask = false;
          setTimeout(() => {
            if (doneTask) resolve("Hoàn thành task!");
            else reject("Chưa hoàn thành task");
          }, 2000);
        });
        return task;
      }

      simulateTask()
        .then((result) => console.log(`Tuyệt, ${result}`))
        .catch((result) => console.log(`Ôi không, ${result}`));
    </script>
  </body>
</html>
