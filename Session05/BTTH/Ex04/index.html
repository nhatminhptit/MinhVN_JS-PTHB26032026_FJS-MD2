  <body>
    <script>
      function calculateSum(numA, numB) {
        return numA + numB;
      }

      let numA = +prompt("Nhập số thứ nhất:");
      let numB = +prompt("Nhập số thứ hai:");
      let sum = calculateSum(numA, numB);
      console.log(sum);
    </script>
