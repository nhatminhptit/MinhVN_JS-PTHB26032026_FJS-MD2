<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function sayHello(username) {
        alert(`Hello ${username}, welcome to JavaScript world!`);
        console.log(`Hello ${username}, welcome to JavaScript world!`);
      }

      let username = prompt("Nhập tên của bạn:");
      sayHello(username);
    </script>
  </body>
</html>
