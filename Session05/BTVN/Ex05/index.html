<html lang="en">

    <meta charset="UTF-8" />

    <title>Document</title>

  <body>
    <script>
      let numbers = [10, 3, 12, 89, 5, 32];

      function checkNumber(searchValue) {
        if (numbers.includes(searchValue)) return numbers.indexOf(searchValue);
        return "Not found!";
      }

      let num = checkNumber(11);
      console.log(num);
    </script>
  </body>
